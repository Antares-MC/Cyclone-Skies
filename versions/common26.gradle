// Shared configuration for Minecraft 26.x modules.
//
// 26.x is a different world from 1.21.x:
//   * the client jar is published deobfuscated -- there are no client_mappings
//     and Fabric publishes neither intermediary nor yarn for 26.x, so there is
//     nothing to remap against;
//   * everything is written against official (Mojang) names;
//   * the game requires Java 25.
//
// So these modules use the non-remapping Loom plugin and official names, and
// the generated source tree comes from the intermediary -> official conversion
// in versions/tools/mojmap.py rather than xlate.py.

apply plugin: 'net.fabricmc.fabric-loom'

def repoRoot = rootProject.projectDir.parentFile
def sharedRes = new File(repoRoot, 'cyclone/src/main/resources')
def genJava = new File(rootProject.projectDir, "gen/${project.name}/java")
def overlayJava = new File(projectDir, 'java')
def overlayShared = new File(rootProject.projectDir, 'v26_shared/java')

version = rootProject.findProperty('mod_version') ?: '1.9.9'
group = rootProject.findProperty('maven_group') ?: 'dev.valence'
base {
    archivesName = "cycloneskies-${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

sourceSets {
    main {
        java {
            def overlay26_1 = new File(rootProject.projectDir, 'v26_1/java')
            setSrcDirs([genJava, overlayShared,
                        overlay26_1.exists() ? overlay26_1 : new File('v26_1-no-shared/java'),
                        overlayJava])
        }
        resources {
            setSrcDirs([sharedRes])
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_release)
}

// The shared resources declare the Minecraft dependency for the 1.21.11 build.
// Every other jar has to narrow that to the version it was compiled against, or
// Fabric will refuse to load it. Rewriting the single depends line here keeps
// the shared fabric.mod.json free of build-system placeholders.
//
// 26.x also raised the required Java runtime to 25, so both lines are rewritten.
//
// The paymentalerts addon is nested as a jar-in-jar; see common.gradle for why
// only a build made for this exact version can go in.
def paymentsJar = new File(repoRoot, "payments/dist/paymentalerts-${project.minecraft_version}.jar")

processResources {
    def mcVersion = project.minecraft_version
    inputs.property 'valenceMinecraftVersion', mcVersion
    inputs.property 'valencePayments', paymentsJar.isFile()
    from(paymentsJar) {
        into 'META-INF/jars'
    }
    filesMatching('fabric.mod.json') {
        filter { String line ->
            line.replace('"minecraft": "~1.21.11"', '"minecraft": "~' + mcVersion + '"')
                .replace('"java": ">=21"', '"java": ">=25"')
        }
    }
    // No ModMenu build exists for the 26.x line, so the config-screen entrypoint
    // would name a class that is not in the jar.
    doLast {
        def meta = destinationDir.toPath().resolve('fabric.mod.json').toFile()
        def text = meta.getText('UTF-8')
        def block = ''',
    "modmenu": [
      "dev.valence.ModMenuIntegration"
    ]'''
        if (text.contains(block)) {
            meta.setText(text.replace(block, ''), 'UTF-8')
        }
        if (paymentsJar.isFile()) {
            logger.lifecycle("nested ${paymentsJar.name} into ${project.name}")
        } else {
            logger.lifecycle("no paymentalerts build for ${mcVersion}; shipping without the addon")
            // The shared metadata lists the nested addon. Without a build for this
            // exact Minecraft version the entry would point at a missing file.
            def jarsBlock = '''  "jars": [
    {
      "file": "META-INF/jars/paymentalerts.jar"
    }
  ],
'''
            if (text.contains(jarsBlock)) {
                text = text.replace(jarsBlock, '')
                meta.setText(text, 'UTF-8')
            }
        }
    }
}

java {
    def rel = Integer.parseInt(project.java_release)
    sourceCompatibility = JavaVersion.toVersion(rel)
    targetCompatibility = JavaVersion.toVersion(rel)
    toolchain {
        languageVersion = JavaLanguageVersion.of(rel)
    }
}

tasks.register('checkGenerated') {
    doLast {
        if (!genJava.isDirectory() || genJava.listFiles() == null || genJava.listFiles().length == 0) {
            throw new GradleException(
                "Missing generated sources for ${project.name}.\n" +
                "Run:  python versions/tools/mojemit.py ${project.minecraft_version}")
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'checkGenerated'
}

plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

version = rootProject.property('mod_version')
group = rootProject.property('maven_group')
base {
    archivesName = rootProject.property('archives_base_name')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.property('minecraft_version')}"
    // The CycloneSkies sources use Fabric Intermediary names (class_*, method_*, field_*).
    mappings "net.fabricmc:intermediary:${rootProject.property('minecraft_version')}:v2"
    modImplementation "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.property('fabric_api_version')}"
    // ModMenu API is compile-only: the mod works with or without ModMenu installed.
    modCompileOnly "com.terraformersmc:modmenu:${rootProject.property('modmenu_version')}"
}

// Bundle the ported paymentalerts mod inside this jar (Fabric jar-in-jar), next to lithium / ImmediatelyFast.
// gradle.projectsEvaluated fires after ALL projects (including :payments) have fully evaluated,
// so loom-remap's afterEvaluate hooks have already registered remapJar by the time we reference it.
gradle.projectsEvaluated {
    def paymentsJar = project(':payments').tasks.named('remapJar')
    processResources {
        dependsOn paymentsJar
        inputs.property 'version', project.version
        from(paymentsJar.flatMap { it.archiveFile }) {
            into 'META-INF/jars'
        }
        filesMatching('fabric.mod.json') {
            expand 'version': project.version
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
